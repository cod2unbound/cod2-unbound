name: Windows bug report
description: Report a reproducible CoD2 Unbound problem on Windows.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use the private link in SECURITY.md.
        Keep credentials and personal information out of your report. Review any log before you paste it.
  - type: input
    id: version
    attributes:
      label: CoD2 Unbound version or Git commit
    validations:
      required: true
  - type: input
    id: game_versions
    attributes:
      label: Game versions
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
    validations:
      required: true
  - type: textarea
    id: graphics_display
    attributes:
      label: Graphics and display
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Redacted game or server log
      render: text
